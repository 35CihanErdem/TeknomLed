<section class="auth-page">
  <app-container>
    <header class="auth-page__intro">
      <p class="auth-page__eyebrow">Hesabınız</p>
      <h1 class="auth-page__title">Tekrar hoş geldiniz.</h1>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-field">
        <label for="login-email">E-posta</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="auth-field">
        <label for="login-password">Şifre</label>
        <div class="auth-field__password">
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button type="button" class="auth-field__toggle" (click)="togglePassword()">
            {{ showPassword() ? 'Gizle' : 'Göster' }}
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="auth-form__error" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="auth-form__submit" [disabled]="submitting()">
        Giriş Yap
      </button>
    </form>

    <div class="auth-divider" aria-hidden="true"><span>veya</span></div>

    <div #googleButton class="auth-google" aria-label="Google ile devam et"></div>

    <p class="auth-page__switch">
      Hesabınız yok mu?
      <a routerLink="/account/register" [queryParams]="{ returnUrl: returnUrl }">Kayıt olun</a>
    </p>
  </app-container>
</section>
