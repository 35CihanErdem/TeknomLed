<div class="info">
  <p class="info__category">{{ product.category.name }}</p>
  <h1 class="info__name">{{ product.name }}</h1>
  <p class="info__desc">{{ product.shortDescription }}</p>

  <app-variant-selector
    [variants]="product.variants"
    [selection]="selection"
    (selectionChange)="selectionChange.emit($event)"
  />

  @if (selectedVariant; as variant) {
    <div class="info__purchase">
      <p class="info__price">{{ formatPrice(variant.price) }}</p>
      <p
        class="info__stock"
        [class.is-limited]="variant.stock > 0 && variant.stock <= 8"
        [class.is-empty]="variant.stock <= 0"
      >
        {{ getStockLabel(variant.stock) }}
      </p>

      <div class="info__qty" role="group" aria-label="Adet">
        <button
          type="button"
          class="info__qty-btn"
          aria-label="Adedi azalt"
          [disabled]="quantity <= 1 || outOfStock"
          (click)="decreaseQuantity()"
        >
          −
        </button>
        <span class="info__qty-value" aria-live="polite">{{ quantity }}</span>
        <button
          type="button"
          class="info__qty-btn"
          aria-label="Adedi artır"
          [disabled]="quantity >= maxQuantity || outOfStock"
          (click)="increaseQuantity()"
        >
          +
        </button>
      </div>

      <button
        type="button"
        class="info__cta"
        [disabled]="outOfStock"
        (click)="submitAddToCart()"
      >
        Sepete Ekle
      </button>

      @if (addedFeedback) {
        <p class="info__feedback" role="status">Sepete eklendi</p>
      }
    </div>
  }
</div>
