<section class="featured" aria-label="Öne çıkan proje">
  <div class="featured__media">
    <img
      [src]="project.image"
      [alt]="project.imageAlt"
      width="1600"
      height="1200"
      loading="lazy"
      decoding="async"
    />
  </div>

  <div class="featured__content">
    <p class="featured__eyebrow">{{ project.eyebrow }}</p>
    <h2 class="featured__title">
      @for (line of project.titleLines; track line) {
        <span>{{ line }}</span>
      }
    </h2>
    <p class="featured__text">{{ project.text }}</p>
    <a [routerLink]="project.ctaPath" class="featured__cta">
      {{ project.ctaLabel }}
    </a>
  </div>
</section>
