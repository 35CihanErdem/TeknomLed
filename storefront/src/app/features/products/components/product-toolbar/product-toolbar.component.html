<div class="toolbar">
  <button
    type="button"
    class="toolbar__filter"
    [attr.aria-expanded]="filterOpen"
    (click)="filterToggle.emit()"
  >
    Filtrele
    <span aria-hidden="true">{{ filterOpen ? '↑' : '↓' }}</span>
  </button>

  <p class="toolbar__count" aria-live="polite">
    {{ resultCount }} ürün
  </p>

  <label class="toolbar__sort">
    <span class="visually-hidden">Sırala</span>
    <select [value]="sort" (change)="onSortChange($event)" aria-label="Sırala">
      @for (option of sortOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>
</div>
